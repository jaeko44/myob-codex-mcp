[project]
name = "myob-codex-mcp"
version = "0.1.0"
description = "Codex-safe MCP server for MYOB Business / AccountRight cloud with read tools and approval-gated write access."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "jaeko44" }
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "mcp[cli]>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
]

[project.scripts]
myob-codex-mcp = "myob_codex_mcp.server:main"
myob-codex-mcp-admin = "myob_codex_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myob_codex_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["myob_codex_mcp"]
strict = false
warn_return_any = false
ignore_missing_imports = true
no_implicit_optional = false
disallow_any_generics = false
disable_error_code = ["import-untyped"]
